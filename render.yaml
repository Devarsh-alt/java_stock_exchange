services:
  - type: web
    name: java-stock-exchange-sg
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: SIMULATOR_ENABLED
        value: "true"
      - key: API_KEY
        generateValue: true
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false